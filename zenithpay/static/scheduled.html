<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled | Zenith Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        zenith: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                            400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                            800: '#065f46', 900: '#064e3b', 950: '#022c22',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.80);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.60);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="app.js"></script>
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-zenith-500 selection:text-slate-950 min-h-screen">

    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-20 left-10 w-[500px] h-[500px] bg-indigo-500/8 rounded-full blur-[140px]"></div>
        <div class="absolute bottom-0 right-10 w-[600px] h-[600px] bg-zenith-500/8 rounded-full blur-[160px]"></div>
    </div>

    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2 group shrink-0">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-zenith-600 via-zenith-500 to-cyan-400 flex items-center justify-center text-slate-950 font-black text-lg shadow-lg shadow-zenith-500/20 group-hover:scale-105 transition-transform">Z</div>
                    <span class="text-lg font-extrabold tracking-tight text-white hidden sm:inline">ZENITH<span class="text-zenith-400">PAY</span></span>
                </a>
                <nav class="hidden md:flex items-center gap-1 text-xs font-semibold">
                    <a href="dashboard.html" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">Dashboard</a>
                    <a href="transfer.html" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">Transfer</a>
                    <a href="send.html" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">Send</a>
                    <a href="bills.html" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">Bills</a>
                    <a href="scheduled.html" class="px-3 py-2 rounded-lg bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">Scheduled</a>
                    <a href="activity.html" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">Activity</a>
                </nav>
                <div class="flex items-center gap-2">
                    <div id="user-chip" class="hidden lg:flex items-center gap-2 pl-1 pr-3 py-1 rounded-full bg-slate-900/80 border border-slate-800">
                        <div id="user-avatar" class="w-7 h-7 rounded-full bg-gradient-to-br from-zenith-500 to-cyan-400 flex items-center justify-center text-slate-950 font-bold text-xs shadow-md">M</div>
                        <div class="text-left leading-tight">
                            <p id="user-name" class="text-xs font-bold text-white">Member</p>
                            <p id="user-email" class="text-[9px] text-slate-400 font-medium">member@zenith.pay</p>
                        </div>
                    </div>
                    <button id="btn-signout" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-200 hover:bg-slate-800 hover:text-white transition-all flex items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket text-[10px]"></i><span class="hidden sm:inline">Sign Out</span>
                    </button>
                </div>
            </div>
            <nav class="md:hidden flex items-center gap-1 text-xs font-semibold overflow-x-auto hide-scrollbar pb-2">
                <a href="dashboard.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white whitespace-nowrap">Dashboard</a>
                <a href="transfer.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white whitespace-nowrap">Transfer</a>
                <a href="send.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white whitespace-nowrap">Send</a>
                <a href="bills.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white whitespace-nowrap">Bills</a>
                <a href="scheduled.html" class="px-3 py-1.5 rounded-lg bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 whitespace-nowrap">Scheduled</a>
                <a href="activity.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white whitespace-nowrap">Activity</a>
            </nav>
        </div>
    </header>

    <main class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24 space-y-6">
        <div class="flex items-end justify-between gap-4 flex-wrap">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Scheduled Payments</h1>
                <p class="text-sm text-slate-400 mt-1">Recurring and one-time payments, executed automatically.</p>
            </div>
            <button id="btn-run-scheduler" class="px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-200 hover:bg-slate-800 hover:text-white transition-all flex items-center gap-2">
                <i class="fa-solid fa-rotate text-[10px]"></i> Run due now
            </button>
        </div>

        <div class="grid lg:grid-cols-3 gap-6 items-start">
            <!-- List -->
            <section class="lg:col-span-2 glass-panel rounded-3xl border border-slate-800/80 p-6">
                <div id="schedule-list" class="space-y-3">
                    <div class="text-xs text-slate-500 text-center py-4">Loading scheduled payments…</div>
                </div>
            </section>

            <!-- New schedule form -->
            <section class="glass-panel rounded-3xl border border-slate-800/80 p-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-calendar-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white">New Schedule</h2>
                        <p class="text-[11px] text-slate-400">Plan a future or recurring payment</p>
                    </div>
                </div>
                <form id="form-schedule" class="space-y-3 text-xs" onsubmit="return handleSchedule(event)">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Type</label>
                        <select id="sched-kind" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="transfer">Transfer (own accounts)</option>
                            <option value="p2p">Send to contact</option>
                            <option value="bill_pay">Pay a bill</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">From</label>
                        <select id="sched-source" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="">Select account</option>
                        </select>
                    </div>
                    <!-- transfer: pick destination account -->
                    <div id="sched-dest-wrap">
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">To</label>
                        <select id="sched-dest" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="">Select account</option>
                        </select>
                    </div>
                    <!-- p2p: free-text recipient -->
                    <div id="sched-recipient-wrap" class="hidden">
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Recipient</label>
                        <input type="text" id="sched-recipient" placeholder="name@company.com or account number" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <!-- bill_pay: pick a payee -->
                    <div id="sched-payee-wrap" class="hidden">
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Payee</label>
                        <select id="sched-payee" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="">Select a payee</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Amount</label>
                        <input type="number" id="sched-amount" step="0.01" min="0.01" placeholder="0.00" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Frequency</label>
                            <select id="sched-frequency" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
                                <option value="once">One-time</option>
                                <option value="weekly">Weekly</option>
                                <option value="biweekly">Every 2 weeks</option>
                                <option value="monthly" selected>Monthly</option>
                                <option value="yearly">Yearly</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Start date</label>
                            <input type="date" id="sched-next" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">End date (optional)</label>
                        <input type="date" id="sched-end" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Description</label>
                        <input type="text" id="sched-desc" required maxlength="200" placeholder="What is this for?" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 text-slate-950 font-bold text-sm hover:brightness-110 transition-all shadow-lg shadow-indigo-500/20">
                        <i class="fa-solid fa-calendar-plus text-xs mr-1"></i> Schedule Payment
                    </button>
                </form>
            </section>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
    /* ============================================================
       Zenith Pay — Scheduled Payments page
       ============================================================ */

    function fillScheduleSelects() {
        const source = document.getElementById("sched-source");
        const dest = document.getElementById("sched-dest");
        const payee = document.getElementById("sched-payee");
        const preselect = requestedSourceId();
        if (source) source.innerHTML = assetAccountOptions(preselect);
        if (dest) {
            const current = dest.value;
            dest.innerHTML = '<option value="">Select account</option>' +
                state.accounts
                    .filter((a) => a.type !== "loan" && String(a.id) !== (source ? source.value : ""))
                    .map((a) => `<option value="${a.id}">${esc(a.nickname || a.type)} · ${a.currency}</option>`)
                    .join("");
            if ([...dest.options].some((o) => o.value === current)) dest.value = current;
        }
        if (payee) {
            const current = payee.value;
            payee.innerHTML = '<option value="">Select a payee</option>' +
                state.payees.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
            if ([...payee.options].some((o) => o.value === current)) payee.value = current;
        }
    }

    function onScheduleKindChange() {
        const kind = document.getElementById("sched-kind").value;
        document.getElementById("sched-dest-wrap").classList.toggle("hidden", kind !== "transfer");
        document.getElementById("sched-recipient-wrap").classList.toggle("hidden", kind !== "p2p");
        document.getElementById("sched-payee-wrap").classList.toggle("hidden", kind !== "bill_pay");
    }

    async function loadSchedules() {
        const data = await apiFetch("/scheduled-payments");
        if (!data) return;
        state.schedules = data.scheduled_payments || [];
        const list = document.getElementById("schedule-list");
        if (!list) return;

        if (state.schedules.length === 0) {
            list.innerHTML = `<div class="text-xs text-slate-500 text-center py-6">No scheduled payments yet — create one on the right.</div>`;
            return;
        }

        list.innerHTML = state.schedules.map((s) => {
            const statusColor = {
                active:   "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
                paused:   "bg-amber-500/10 text-amber-400 border-amber-500/30",
                done:     "bg-slate-700/60 text-slate-400 border-slate-600/60",
                cancelled:"bg-rose-500/10 text-rose-400 border-rose-500/30",
            }[s.status] || "bg-slate-700/60 text-slate-400 border-slate-600/60";

            const kindLabel = { transfer: "Transfer", p2p: "P2P", bill_pay: "Bill Pay" }[s.kind] || s.kind;

            let target = s.source_nickname || "—";
            if (s.kind === "transfer" && s.dest_account_id) {
                const dest = state.accounts.find((a) => a.id === s.dest_account_id);
                target = `${s.source_nickname || "?"} → ${dest ? dest.nickname || "account" : "account"}`;
            } else if (s.kind === "p2p") {
                target = s.recipient || "contact";
            } else if (s.kind === "bill_pay" && s.payee_name) {
                target = s.payee_name;
            }

            const isSettled = s.status === "done" || s.status === "cancelled";
            return `
                <div class="glass-card rounded-2xl px-4 py-4 border border-slate-800/80 text-xs">
                    <div class="flex items-start justify-between gap-2 mb-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <i class="fa-solid ${s.kind === "transfer" ? "fa-arrow-right-arrow-left" : s.kind === "p2p" ? "fa-user-group" : "fa-file-invoice"} text-slate-500"></i>
                            <span class="font-semibold text-white truncate">${esc(s.description)}</span>
                        </div>
                        <span class="shrink-0 px-2 py-0.5 rounded-full text-[9px] font-bold uppercase border ${statusColor}">${s.status}</span>
                    </div>
                    <div class="text-slate-400">${kindLabel} · ${esc(target)}</div>
                    <div class="flex items-center justify-between mt-2">
                        <span class="font-bold font-mono text-white">${centsToCurrency(s.amount_cents)}</span>
                        <div class="flex items-center gap-2 text-slate-400">
                            <span><i class="fa-regular fa-calendar mr-1"></i>${formatDate(s.next_due_at)}</span>
                            <span class="text-[10px] uppercase">${s.frequency}</span>
                        </div>
                    </div>
                    ${s.last_error ? `<p class="mt-2 text-[10px] text-rose-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i>${esc(s.last_error)}</p>` : ""}
                    <div class="mt-3 flex gap-2">
                        ${s.status === "active"
                            ? `<button class="flex-1 text-[10px] py-2 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-400 font-semibold hover:bg-amber-500/20 transition-all"
                                onclick="toggleSchedule(${s.id}, 'paused')">Pause</button>`
                            : s.status === "paused"
                            ? `<button class="flex-1 text-[10px] py-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-semibold hover:bg-emerald-500/20 transition-all"
                                onclick="toggleSchedule(${s.id}, 'active')">Resume</button>`
                            : `<span class="flex-1 text-[10px] text-slate-500 py-2 text-center">${isSettled ? "Settled" : ""}</span>`}
                        ${!isSettled
                            ? `<button class="flex-1 text-[10px] py-2 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 font-semibold hover:bg-rose-500/20 transition-all"
                                onclick="cancelSchedule(${s.id})">Cancel</button>`
                            : ""}
                    </div>
                </div>`;
        }).join("");
    }

    async function toggleSchedule(id, status) {
        const data = await apiFetch(`/scheduled-payments/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
        });
        if (!data) return;
        triggerToast(`Schedule ${status === "active" ? "resumed" : "paused"} successfully`, "success");
        await loadSchedules();
    }

    async function cancelSchedule(id) {
        if (!window.confirm("Cancel this scheduled payment?")) return;
        const data = await apiFetch(`/scheduled-payments/${id}`, { method: "DELETE" });
        if (!data) return;
        triggerToast("Scheduled payment cancelled successfully", "success");
        await loadSchedules();
    }

    async function runScheduler() {
        const data = await apiFetch("/scheduler/run", { method: "POST" });
        if (!data) return;
        triggerToast(`Ran due payments — ${data.executed} executed, ${data.failed} failed`, data.failed ? "info" : "success");
        await Promise.all([loadSchedules(), loadAccounts()]);
    }

    async function handleSchedule(e) {
        e.preventDefault();
        const kind = document.getElementById("sched-kind").value;
        const source = document.getElementById("sched-source").value;
        const amount = document.getElementById("sched-amount").value;
        const frequency = document.getElementById("sched-frequency").value;
        const next = document.getElementById("sched-next").value;
        const end = document.getElementById("sched-end").value;
        const desc = document.getElementById("sched-desc").value.trim();

        if (!source) { triggerToast("Select a source account", "error"); return false; }
        if (!amount || isNaN(amount) || Number(amount) <= 0) { triggerToast("Enter a valid amount", "error"); return false; }
        if (!next) { triggerToast("Select a start date", "error"); return false; }

        const body = {
            source_account_id: Number(source),
            amount_cents: Math.round(Number(amount) * 100),
            description: desc,
            frequency,
            next_due_at: next,
        };
        if (end) body.end_at = end;

        if (kind === "transfer") {
            const dest = document.getElementById("sched-dest").value;
            if (!dest) { triggerToast("Select a destination account", "error"); return false; }
            if (dest === source) { triggerToast("Source and destination must differ", "error"); return false; }
            body.dest_account_id = Number(dest);
        } else if (kind === "p2p") {
            const recipient = document.getElementById("sched-recipient").value.trim();
            if (!recipient) { triggerToast("Enter a recipient (email or account number)", "error"); return false; }
            body.recipient = recipient;
        } else {
            const payeeId = document.getElementById("sched-payee").value;
            if (!payeeId) { triggerToast("Select a payee (add one on the Bills page if needed)", "error"); return false; }
            body.payee_id = Number(payeeId);
        }

        const data = await apiFetch("/scheduled-payments", { method: "POST", body: JSON.stringify(body) });
        if (!data) return false;
        triggerToast(`Scheduled: ${desc} — ${centsToCurrency(body.amount_cents)}`, "success");
        document.getElementById("sched-amount").value = "";
        document.getElementById("sched-desc").value = "";
        document.getElementById("sched-end").value = "";
        await loadSchedules();
        return false;
    }

    document.getElementById("sched-kind").addEventListener("change", onScheduleKindChange);
    document.getElementById("sched-source").addEventListener("change", () => fillScheduleSelects());
    document.getElementById("btn-run-scheduler").addEventListener("click", runScheduler);

    (async function boot() {
        await safeRun("Session", loadUser);
        await safeRun("Accounts", async () => {
            await loadAccounts();
            fillScheduleSelects();
        });
        await safeRun("Payees", async () => {
            const data = await apiFetch("/payees");
            if (!data) return;
            state.payees = data.payees || [];
            fillScheduleSelects();
        });
        await safeRun("Scheduled payments", loadSchedules);
        onScheduleKindChange();
        const next = document.getElementById("sched-next");
        if (next && !next.value) next.value = new Date().toISOString().slice(0, 10);
    })();
    </script>
</body>
</html>
